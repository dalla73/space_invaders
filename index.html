<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Invaders — tribute</title>
<style>
  :root {
    --ink: #f4efe2;
    --dim: #5c5c66;
    --line: #26262e;
    --panel: #0d0d11;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: var(--ink);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px 12px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .cabinet {
    padding: 12px;
    border-radius: 18px;
    background: linear-gradient(180deg, #15151a 0%, #0a0a0e 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 40px 90px -40px #000,
      inset 0 1px 0 #2a2a33;
    max-width: 100%;
  }
  .screen {
    position: relative;
    width: min(calc(100vw - 52px), calc((100dvh - 180px) * 0.7368));
    aspect-ratio: 560 / 760;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, .9), 0 0 0 1px #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    outline: none;
  }
  canvas:focus-visible { box-shadow: inset 0 0 0 2px #46ff8a; }
  .scanlines, .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 10px;
  }
  .scanlines {
    background: repeating-linear-gradient(180deg,
      rgba(0, 0, 0, .34) 0 1px,
      rgba(0, 0, 0, 0) 1px 3px);
    opacity: .5;
    mix-blend-mode: multiply;
  }
  .vignette {
    background: radial-gradient(125% 92% at 50% 44%,
      rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, .55) 100%);
  }
  .hint {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.9;
  }
  .hint b { color: #b6b6c1; font-weight: 500; }
  .touch { display: none; gap: 18px; }
  .tbtn {
    width: 66px; height: 66px;
    border-radius: 50%;
    background: #13131a;
    border: 2px solid #2c2c38;
    color: #cfcfd8;
    font: inherit;
    font-size: 15px;
    letter-spacing: .1em;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tbtn:active { background: #22222e; border-color: #4c4c60; }
  @media (pointer: coarse) {
    .touch { display: flex; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <div class="cabinet">
    <div class="screen">
      <canvas id="screen" width="560" height="760" tabindex="0"
        aria-label="Space Invaders. Setas ou A e D movem, espaco atira, P pausa, M liga ou desliga o som."></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </div>
  </div>

  <div class="touch" id="touch" aria-hidden="true">
    <button class="tbtn" data-key="left" type="button">&#9664;</button>
    <button class="tbtn" data-key="fire" type="button">FIRE</button>
    <button class="tbtn" data-key="right" type="button">&#9654;</button>
  </div>

  <p class="hint">
    <b>&larr; &rarr;</b> mover &nbsp;&middot;&nbsp; <b>espa&ccedil;o</b> atirar
    &nbsp;&middot;&nbsp; <b>P</b> pausa &nbsp;&middot;&nbsp; <b>M</b> som
  </p>

<script src="game.js"></script>
</body>
</html>
